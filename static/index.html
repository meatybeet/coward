<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WAYHOST Docker Image Gallery</title>
    <style>
      body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; font: 16px system-ui, sans-serif; color: #1f2937; }
      form { display: flex; gap: .75rem; align-items: center; padding: 1rem; border: 1px solid #d1d5db; border-radius: .5rem; }
      button { padding: .55rem .85rem; border: 0; border-radius: .35rem; color: white; background: #2563eb; cursor: pointer; }
      #message { min-height: 1.5rem; }
      #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
      figure { margin: 0; padding: .6rem; border: 1px solid #e5e7eb; border-radius: .5rem; }
      img { display: block; width: 100%; height: 150px; object-fit: cover; border-radius: .25rem; }
      figcaption { overflow: hidden; margin-top: .5rem; text-overflow: ellipsis; white-space: nowrap; }
    </style>
  </head>
  <body>
    <h1>WAYHOST Docker Image Gallery</h1>
    <p>This page uses FastAPI, MongoDB, Redis, and MinIO inside one Docker image.</p>
    <form id="upload-form">
      <input id="file" name="file" type="file" accept="image/*" required>
      <button type="submit">Upload image</button>
    </form>
    <p id="message" role="status"></p>
    <section id="gallery" aria-live="polite"></section>
    <script>
      const message = document.querySelector('#message');
      const gallery = document.querySelector('#gallery');

      async function loadImages() {
        const response = await fetch('/api/images');
        const images = await response.json();
        gallery.replaceChildren(...images.map((image) => {
          const figure = document.createElement('figure');
          const preview = document.createElement('img');
          preview.src = `/api/images/${image.id}`;
          preview.alt = image.name;
          const caption = document.createElement('figcaption');
          caption.textContent = `${image.name} (${Math.ceil(image.size / 1024)} KB)`;
          figure.append(preview, caption);
          return figure;
        }));
      }

      document.querySelector('#upload-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = 'Uploading…';
        const response = await fetch('/api/images', { method: 'POST', body: new FormData(event.currentTarget) });
        const result = await response.json();
        if (!response.ok) {
          message.textContent = result.detail || 'Upload failed.';
          return;
        }
        message.textContent = `${result.name} uploaded.`;
        event.currentTarget.reset();
        await loadImages();
      });

      loadImages().catch(() => { message.textContent = 'Could not load the gallery.'; });
    </script>
  </body>
</html>
